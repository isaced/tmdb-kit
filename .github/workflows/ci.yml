name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Typecheck, test, and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck, test, and build
        run: bun run ci

      - name: Smoke test built artifacts
        run: |
          node -e "import('./dist/index.js').then((m) => { if (typeof m.createTMDB !== 'function') process.exit(1) })"
          node -e "const m = require('./dist/index.cjs'); if (typeof m.createTMDB !== 'function') process.exit(1)"
          node dist/cli.js --help > /dev/null
          bun dist/cli.js --help > /dev/null

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info