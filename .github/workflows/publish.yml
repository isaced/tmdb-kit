name: Publish

on:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    name: Publish to npm
    # Pin the image so the ubuntu-latest migration does not change the toolchain.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify package
        run: bun run ci

      - name: Publish package
        run: |
          VERSION=$(bun -e "console.log(require('./package.json').version)")
          TAG=$(bun -e "const v=require('./package.json').version; const m=v.match(/-([a-z]+)/); console.log(m?m[1]:'latest')")
          if npm view "tmdb-kit@$VERSION" version > /dev/null 2>&1; then
            echo "tmdb-kit@$VERSION is already on npm, skipping."
            exit 0
          fi
          LOG=$(mktemp)
          if npm publish --provenance --access public --tag "$TAG" 2>&1 | tee "$LOG"; then
            exit 0
          fi
          # A 409 means the version is staged and waits for maintainer approval,
          # which CI cannot grant. Leave the run green but surface the reminder.
          if grep -q "previously staged version" "$LOG"; then
            echo "::warning::tmdb-kit@$VERSION is staged on npm and needs approval at https://www.npmjs.com/package/tmdb-kit"
            exit 0
          fi
          exit 1

      - uses: actions/checkout@v7
      - name: Publish package (jsr)
        run: |
          NAME=$(bun -e "console.log(require('./jsr.json').name)")
          VERSION=$(bun -e "console.log(require('./jsr.json').version)")
          if curl -fsS "https://jsr.io/$NAME/meta.json" | grep -q "\"$VERSION\""; then
            echo "$NAME@$VERSION is already on jsr, skipping."
            exit 0
          fi
          bunx jsr publish
